<div class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-hero">
        <h1>قم بتسجيل الدخول لحسابك</h1>
        <p class="subtitle">لوحة التحكم المالية</p>
      </div>

      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="Submit()">
        <div class="field">
          <label>البريد الالكترونى :</label>
          <div class="input-with-icon">
            <input type="text" placeholder="example@example.com" id="email" formControlName="email">
            <i class="pi pi-envelope"></i>
          </div>
          <div class="errormsg" [hidden]="email?.valid || email?.untouched">
            <small class="text-danger" *ngIf="email?.errors?.['required']">البريد الإلكترونى مطلوب</small>
          </div>
        </div>

        <div class="field">
          <label>كلمة المرور :</label>
          <div class="input-with-icon">
            <input [type]="showPassword ? 'text' : 'password'" placeholder="********" id="inputPassword" formControlName="password">
            <i class="pi" [ngClass]="showPassword ? 'pi-eye' : 'pi-eye-slash'" (click)="showPassword = !showPassword" style="cursor:pointer"></i>
          </div>
          <div class="errormsg" [hidden]="password?.valid || password?.untouched">
            <small class="text-danger" *ngIf="password?.errors?.['required']">كلمة المرور مطلوبة</small>
          </div>
        </div>

        <div class="form-actions">
          <div class="remember">
            <label for="check"><input type="checkbox" id="check"> تذكرنى لاحقاً</label>
          </div>
          <a class="forgot" routerLink="/forgot">نسيت كلمة المرور</a>
        </div>

        <div class="submit-row">
          <button class="primary-btn" [disabled]="loginForm.invalid">
            تسجيل الدخول
            <i *ngIf="loading" class="pi pi-spin pi-spinner"></i>
          </button>
        </div>
        <div class="register-link">ليس لديك حساب؟ <a routerLink="/register">انشاء حساب جديد</a></div>
        <div class="error-msg" *ngIf="error">{{error}}</div>
      </form>
    </div>
  </div>

  <div class="login-wave" aria-hidden="true">
    <div class="right">
      <p>Copyright © 2025</p>
    </div>
    <div class="left">
      <a href="">Privacy Policy</a>
      <a href>Terms & Conditions</a>
    </div>
  </div>
</div>
